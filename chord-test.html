<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chord Detection Test</title>
<style>:root{--bg:#fff;--fg:#111}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee}}:root[data-theme="dark"]{--bg:#111;--fg:#eee}
body{background:var(--bg);color:var(--fg);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:0;padding:16px}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><h3>Chord detection test</h3><pre id="out">starting…</pre>
<script>
// ---------- Chord detection (polyphonic) ----------
// Uses Basic Pitch, a small open-source neural network by Spotify (Apache-2.0) that was trained to hear several
// notes at once. It runs entirely on the phone (about 1 MB model, loaded once from the jsDelivr CDN and then
// cached by the browser). Audio is converted to 22,050 Hz mono, which is what the model expects.
const BP_BASE = "https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/";
const BP_SETTINGS = { onset: 0.5, frame: 0.3, minLenFrames: 5 }; // detection sensitivity (tuned in testing)
let bpModulePromise = null, bpInstance = null;
function loadChordModel(){
  if (!bpModulePromise){
    bpModulePromise = import(BP_BASE + "+esm").then(mod => {
      bpInstance = new mod.BasicPitch(BP_BASE + "model/model.json");
      return bpInstance.model.then(() => mod); // wait until the network itself has downloaded
    });
    bpModulePromise.catch(() => { bpModulePromise = null; bpInstance = null; }); // allow a retry later
  }
  return bpModulePromise;
}
function resampleTo22050(samples, sr){
  if (sr === 22050) return Promise.resolve(samples);
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const len = Math.ceil(samples.length * 22050 / sr);
  const oc = new OC(1, len, 22050);
  const buf = oc.createBuffer(1, samples.length, sr);
  buf.getChannelData(0).set(samples);
  const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start(0);
  return new Promise((res, rej) => {
    oc.oncomplete = e => res(e.renderedBuffer.getChannelData(0).slice());
    const p = oc.startRendering();
    if (p && p.then) p.then(b => res(b.getChannelData(0).slice()), rej);
  });
}
// Returns note segments in the same shape the rest of the app uses: { midi, start, end, peak, vel }.
async function transcribeChords(samples, sr, onProgress, settings){
  const st = Object.assign({}, BP_SETTINGS, settings || {});
  const mod = await loadChordModel();
  const x = await resampleTo22050(samples, sr);
  const frames = [], onsets = [], contours = [];
  await bpInstance.evaluateModel(x, (f, o, c) => { frames.push(...f); onsets.push(...o); contours.push(...c); },
    p => { if (onProgress) onProgress(Math.round(100 * Math.min(1, p))); });
  const notes = mod.noteFramesToTime(mod.addPitchBendsToNoteEvents(contours,
    mod.outputToNotesPoly(frames, onsets, st.onset, st.frame, st.minLenFrames)));
  const segs = notes
    .filter(n => n.pitchMidi >= 21 && n.pitchMidi <= 108)
    .map(n => ({ midi: n.pitchMidi, start: n.startTimeSeconds, end: n.startTimeSeconds + n.durationSeconds, peak: n.amplitude }));
  const maxPeak = segs.reduce((m, sg) => Math.max(m, sg.peak), 0) || 1;
  segs.forEach(sg => { sg.vel = Math.min(1, Math.max(0.25, Math.sqrt(sg.peak / maxPeak))); });
  segs.sort((a, b) => a.start - b.start || a.midi - b.midi);
  return segs;
}
const out = document.getElementById("out"); const log = s => { out.textContent += "\n" + s; };
out.textContent = "";
const NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"]; const nm = m => NAMES[m%12]+(Math.floor(m/12)-1);
const SAMPLE_NAMES=["C","Cs","D","Ds","E","F","Fs","G","Gs","A","As","B"];
const SM=[]; for(let m=21;m<=108;m++) if([0,3,6,9].includes(m%12)) SM.push(m);
const near = m => SM.reduce((b,s)=>Math.abs(s-m)<Math.abs(b-m)?s:b, SM[0]);
const file = m => SAMPLE_NAMES[m%12]+(Math.floor(m/12)-1)+".mp3";
const SOURCES = ["https://cdn.jsdelivr.net/gh/Tonejs/audio@master/salamander/","https://tonejs.github.io/audio/salamander/"];

// ---- test pieces: [midi, onset, duration, velocity] ----
function piece1(){ // block chords
  const ch=[[60,64,67],[57,60,64],[53,57,60,65],[55,59,62,65],[48,55,64,72]]; const n=[];
  ch.forEach((c,i)=>c.forEach(m=>n.push([m,0.3+i*1.1,1.0,0.8]))); return n; }
function piece2(){ // Moonlight-3rd-like: fast rising C#-minor arpeggios (16ths at 160 bpm) over bass octaves, pedal held per bar
  const n=[]; const step=60/160/4; let t=0.3;
  const bars=[[49,56,61,64],[49,56,61,64],[45,57,61,64],[44,56,60,63]];
  bars.forEach((b,bi)=>{ const barStart=t; n.push([b[0]-12,barStart,step*16,0.9],[b[0],barStart,step*16,0.9]);
    const ar=[b[1],b[2],b[3],b[1]+12,b[2]+12,b[3]+12,b[1]+24,b[2]+24];
    for(let i=0;i<16;i++){ const m=ar[i%8]+(i>=8?0:0); n.push([m, t+ (i)*step, (16-i)*step, 0.55+0.3*(i%4===0)]); }
    t += step*16; });
  return n; }
function piece3(){ // melody over left-hand chords
  const n=[]; const mel=[76,74,72,74,76,76,76,74,74,74,76,79,79]; const beat=0.42; let t=0.3;
  mel.forEach((m,i)=>{ n.push([m,t+i*beat,beat*0.9,0.85]); if(i%4===0) [48,55,60].forEach(c=>n.push([c,t+i*beat,beat*3.8,0.55])); });
  return n; }
function piece4(){ // repeated and fast single notes
  const n=[]; let t=0.3; for(let i=0;i<4;i++) n.push([60,t+i*0.25,0.22,0.8]); t+=1.2;
  [60,62,64,65,67,69,71,72].forEach((m,i)=>n.push([m,t+i*0.12,0.11,0.8])); return n; }
const PIECES = [["Block chords (3-4 notes)",piece1()],["Fast arpeggios with pedal (Moonlight 3rd-like)",piece2()],["Melody + left-hand chords",piece3()],["Repeated & fast single notes",piece4()]];

async function loadSamples(ctx, need){
  const bufs={};
  for (const s of need){
    let ok=false;
    for (const base of SOURCES){ try{ const r=await fetch(base+file(s)); if(!r.ok) throw new Error(r.status); bufs[s]=await ctx.decodeAudioData(await r.arrayBuffer()); ok=true; break; }catch(e){ log("  sample "+file(s)+" from "+base+" failed: "+e); } }
    if(!ok) throw new Error("no sample source reachable");
  }
  return bufs;
}
async function render(notes, bufs, sr){
  const dur = Math.max(...notes.map(n=>n[1]+n[2]))+1.5;
  const oc = new OfflineAudioContext(1, Math.ceil(dur*sr), sr);
  for (const [m,on,d,v] of notes){
    const s=near(m); const src=oc.createBufferSource(); src.buffer=bufs[s]; src.playbackRate.value=Math.pow(2,(m-s)/12);
    const g=oc.createGain(); g.gain.setValueAtTime(0.35*v*v,on); g.gain.setTargetAtTime(0,on+d,0.08);
    src.connect(g); g.connect(oc.destination); src.start(on); src.stop(on+d+0.6);
  }
  const b = await oc.startRendering(); return b.getChannelData(0).slice();
}
function score(truth, det, tol=0.07){
  const used=new Set(); let tp=0; const missed=[];
  for (const [m,on] of truth){ let best=-1,bd=1e9; det.forEach((d,i)=>{ if(used.has(i)||d.midi!==m) return; const dd=Math.abs(d.start-on); if(dd<=tol&&dd<bd){bd=dd;best=i;} });
    if(best>=0){used.add(best);tp++;} else missed.push(nm(m)+"@"+on.toFixed(2)); }
  const extra = det.filter((d,i)=>!used.has(i)).map(d=>nm(d.midi)+"@"+d.start.toFixed(2));
  const P=tp/Math.max(1,det.length), R=tp/Math.max(1,truth.length), F=2*P*R/Math.max(1e-9,P+R);
  return {tp,P,R,F,missed,extra};
}
(async()=>{
  try{
    log("1) loading model…"); let t0=performance.now();
    await loadChordModel(); log("   model ready in "+Math.round(performance.now()-t0)+" ms");
    const ctx = new OfflineAudioContext(1,1,44100);
    const need=[...new Set(PIECES.flatMap(p=>p[1].map(n=>near(n[0]))))];
    log("2) loading "+need.length+" real piano samples (Salamander)…"); t0=performance.now();
    const bufs = await loadSamples(ctx, need); log("   samples ready in "+Math.round(performance.now()-t0)+" ms");
    const settingsList=[{onset:0.5,frame:0.3,minLenFrames:5},{onset:0.4,frame:0.3,minLenFrames:5},{onset:0.3,frame:0.25,minLenFrames:5},{onset:0.6,frame:0.35,minLenFrames:5}];
    const totals = settingsList.map(()=>({tp:0,det:0,tru:0}));
    for (const [title, notes] of PIECES){
      const audio = await render(notes, bufs, 44100);
      log("\n== "+title+": "+notes.length+" notes, "+(audio.length/44100).toFixed(1)+" s of audio");
      for (let k=0;k<settingsList.length;k++){
        t0=performance.now(); const det = await transcribeChords(audio, 44100, null, settingsList[k]); const ms=performance.now()-t0;
        const sc=score(notes, det); totals[k].tp+=sc.tp; totals[k].det+=det.length; totals[k].tru+=notes.length;
        log(`  [onset ${settingsList[k].onset}, frame ${settingsList[k].frame}] found ${det.length}, correct ${sc.tp}/${notes.length} | precision ${(100*sc.P).toFixed(0)}% recall ${(100*sc.R).toFixed(0)}% F ${(100*sc.F).toFixed(0)}% | ${Math.round(ms)} ms`);
        if (k===0){ if(sc.missed.length) log("     missed: "+sc.missed.slice(0,24).join(" ")+(sc.missed.length>24?" …":""));
                    if(sc.extra.length) log("     extra:  "+sc.extra.slice(0,24).join(" ")+(sc.extra.length>24?" …":"")); }
      }
    }
    log("\n== TOTALS");
    settingsList.forEach((s,k)=>{ const t=totals[k]; const P=t.tp/t.det,R=t.tp/t.tru; log(`  onset ${s.onset} frame ${s.frame}: precision ${(100*P).toFixed(1)}% recall ${(100*R).toFixed(1)}% F ${(100*2*P*R/(P+R)).toFixed(1)}%`); });
    log("\nDONE");
  }catch(e){ log("\nERROR: "+(e&&e.stack||e)); }
})();
</script></body></html>
