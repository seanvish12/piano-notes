<style>
:root{
  --bg:#000000; --fg:#f2f2f5; --muted:#9a9aa5; --accent:#7c86ff;
  --key-white:#ececf1; --key-black:#0a0a10; --key-border:rgba(0,0,0,.35); --panel:#141418;
  --kb-h:clamp(110px, 26vh, 320px);   /* keyboard height scales with the screen */
  box-sizing:border-box;
}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.mode-live{--kb-h:clamp(130px, 34vh, 380px)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}

.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px 6px}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:.2px}
.modes{display:flex;gap:6px}
.modeBtn{appearance:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--fg);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600}
.modeBtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

#panel{flex:0 0 auto;padding:0 14px 10px}
body.mode-live #panel{flex:1 1 auto;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center}
.panelBlock{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.readout{text-align:center}
.readout .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.readout .note{font-size:clamp(36px,9vh,60px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.readout .freq{font-size:15px;color:var(--muted);min-height:1.2em}
.debug{width:100%;max-width:420px;background:var(--panel);border-radius:12px;padding:10px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.debug b{color:var(--fg)}
.bigBtn{appearance:none;border:none;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;min-width:190px}
.bigBtn.on{background:#e5484d}
#recordControls .bigBtn{min-width:0;padding:10px 22px;font-size:15px}
#permError{display:none;width:100%;background:var(--panel);border-radius:12px;padding:16px;text-align:center;gap:10px;flex-direction:column}
#permError p{margin:0;color:var(--muted);font-size:14px}
.smallBtn{appearance:none;border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.smallBtn:disabled{opacity:.4}
.ctrlRow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;width:100%}
#recStatus{font-size:13px;color:var(--muted);min-height:1.2em;text-align:center}
.playbackRow{display:flex;gap:8px}
.soundRow,.speedRow{align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.speedRow b{color:var(--fg)}
.speedRow input{width:130px}
.importBtn{background:#2a2a36 !important}
.detectRow{display:none;gap:4px;margin-left:auto}
body.mode-record .detectRow{display:flex}
.detectRow .modeBtn{padding:4px 12px;font-size:12px}
.importRow{font-size:13px;color:var(--muted)}
.importName{color:var(--fg);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeIn{width:64px;margin-left:4px;background:#1d1d27;color:var(--fg);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px;font-size:16px;text-align:center}
button:disabled{opacity:.4}
.credit{position:absolute;top:4px;right:8px;left:8px;z-index:3;pointer-events:none;font-size:10px;color:var(--muted);text-align:right;opacity:.6}

/* The stage = falling notes (fills all the leftover height) + the keyboard, pinned to the bottom edge. */
#stage{position:relative;flex:0 0 auto;display:flex;flex-direction:column;background:#000;padding-bottom:env(safe-area-inset-bottom,0px)}
body.mode-record #stage{flex:1 1 auto;min-height:0}
.roll{display:none;flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
body.mode-record .roll{display:block}
.roll::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);opacity:.55}
.fnote{position:absolute;border-radius:3px;opacity:.9}
.keyboard{position:relative;flex:0 0 auto;width:100%;height:var(--kb-h)}
.wkey{position:absolute;top:0;bottom:0;background:var(--key-white);border-right:1px solid var(--key-border);border-radius:0 0 4px 4px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;transition:background .06s ease}
.wkey span{font-size:clamp(8px,2.2vw,12px);color:#555;white-space:nowrap;pointer-events:none}
.wkey.active{background:var(--accent)}
.wkey.active span{color:#fff}
.bkey{position:absolute;top:0;height:62%;background:var(--key-black);border-radius:0 0 3px 3px;z-index:2;transition:background .06s ease;box-shadow:inset 0 -3px 0 rgba(255,255,255,.08)}
.bkey.active{background:var(--accent)}

/* Short screens (phone held sideways): tighter controls, keyboard still fills the bottom. */
@media (max-height:520px){
  .top{padding:4px 14px}
  .bigBtn{padding:8px 18px;font-size:14px;min-width:0}
  .readout .note{font-size:34px}
  .readout .freq{display:none}
  body.mode-live #liveControls{flex-direction:row;flex-wrap:wrap;justify-content:center}
  body.mode-live{--kb-h:clamp(100px, 38vh, 380px)}
  body.mode-record{--kb-h:clamp(90px, 30vh, 320px)}
  #panel{padding-bottom:6px}
}

/* iPhone held upright: Safari can't lock orientation, so the whole app is turned 90 degrees and laid out
   as landscape. Turn the phone sideways (top edge to the left) and it reads normally. If rotation lock is off
   and the phone really switches to landscape, this rule stops applying and the normal landscape layout is used,
   which looks the same. Inside here the app's width is the screen's height (vh) and its height is the
   screen's width (vw), so sizes use vw where the landscape layout uses vh. */
@media (orientation:portrait) and (max-width:600px) and (pointer:coarse){
  #app{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;
       transform:translateX(100vw) rotate(90deg);transform-origin:top left;
       padding-top:0;padding-left:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-bottom,0px)}
  #stage{padding-bottom:0}
  :root{--kb-h:clamp(90px,30vw,320px)}
  body.mode-live{--kb-h:clamp(100px,38vw,380px)}
  body.mode-record{--kb-h:clamp(90px,30vw,320px)}
  .top{padding:4px 14px}
  .bigBtn{padding:8px 18px;font-size:14px;min-width:0}
  .readout .note{font-size:34px}
  .readout .freq{display:none}
  body.mode-live #liveControls{flex-direction:row;flex-wrap:wrap;justify-content:center}
  #panel{padding-bottom:6px}
  .wkey span{font-size:clamp(8px,1.6vh,12px)}
}
</style>
</head>
<body class="mode-live">
<div id="app">
  <header class="top">
    <h1>Piano Note Detector</h1>
    <div class="detectRow">
      <button id="detChordsBtn" class="modeBtn active" title="Hears several notes at once">Chords (AI)</button>
      <button id="detSingleBtn" class="modeBtn" title="One note at a time">Single notes</button>
    </div>
    <div class="modes">
      <button id="modeLiveBtn" class="modeBtn active">Live</button>
      <button id="modeRecordBtn" class="modeBtn">Record</button>
    </div>
  </header>

  <section id="panel">
    <div id="liveControls" class="panelBlock">
      <div class="readout">
        <div class="label">Detected</div>
        <div class="note" id="noteOut">&mdash;</div>
        <div class="freq" id="freqOut">&nbsp;</div>
      </div>
      <div class="debug" id="debugOut">
        Listening: <b>NO</b><br>Confidence: <b>0.00</b><br>State: <b>idle</b>
      </div>
      <button id="startBtn" class="bigBtn">Start Listening</button>
      <div id="permError">
        <p>Microphone access is required to detect piano notes.</p>
        <button id="retryBtn" class="smallBtn">Try Again</button>
      </div>
    </div>

    <div id="recordControls" class="panelBlock" style="display:none">
      <div class="ctrlRow">
        <button id="recordBtn" class="bigBtn">&#9679; Record</button>
        <button id="importBtn" class="bigBtn importBtn">&#128193; Import file</button>
        <input type="file" id="fileInput" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.mp4,.mov,.flac,.ogg" style="display:none">
        <div id="playbackControls" class="playbackRow" style="display:none">
          <button id="playBtn" class="smallBtn">&#9654; Play</button>
          <button id="restartBtn" class="smallBtn">&#8635; Restart</button>
        </div>
      </div>
      <div id="importRow" class="ctrlRow importRow" style="display:none">
        <span id="importName" class="importName"></span>
        <label>From <input id="importStart" class="timeIn" type="text" inputmode="decimal" autocomplete="off" value="0:00"></label>
        <label>to <input id="importEnd" class="timeIn" type="text" inputmode="decimal" autocomplete="off" value="0:30"></label>
        <button id="analyzeBtn" class="smallBtn">Analyze</button>
      </div>
      <div id="recStatus"></div>
      <audio id="playbackAudio" style="display:none"></audio>
      <div class="ctrlRow">
        <div id="soundRow" class="soundRow" style="display:none">
          <span>Play as:</span>
          <button id="soundPianoBtn" class="modeBtn active">Piano</button>
          <button id="soundOrigBtn" class="modeBtn">Original recording</button>
        </div>
        <div id="speedRow" class="speedRow" style="display:none">
          <span>Speed: <b id="speedVal">1x</b></span>
          <input type="range" id="speedSlider" min="0.25" max="2" step="0.25" value="1">
        </div>
      </div>
    </div>
  </section>

  <div id="stage">
    <div id="credit" class="credit" style="display:none">Piano sounds: Salamander Grand Piano by Alexander Holm (CC BY 3.0), via Tone.js</div>
    <div id="roll" class="roll"></div>
    <div id="keyboard" class="keyboard"></div>
  </div>
</div>

<script>
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function midiToName(m){ return NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1); }
function freqToMidi(f){ return Math.round(69 + 12*Math.log2(f/440)); }

const MIN_F = 24, MAX_F = 4300, WINDOW_SIZE = 4096, HOP_SIZE = 1024;

// ---------- NoteDetector: onset/release state machine with onset/sustain hysteresis ----------
// While a note is already active, a lower confidence bar keeps it displayed (sustainConfidenceThreshold)
// than the bar required to start one (onsetConfidenceThreshold). This is what lets a held, decaying
// piano note keep showing instead of dropping out the moment it gets quieter.
class NoteDetector{
  constructor(){
    this.onsetConfidenceThreshold = 0.55;
    this.sustainConfidenceThreshold = 0.28;
    this.framesToConfirmOnset = 2;
    this.framesToConfirmRelease = 8;
    this.framesToLeaveActive = 4; // how many consecutive disagreeing frames before we'll abandon an already-playing note
    this.reattackRatio = 1.6;   // a fresh strike must be at least this much louder than the moment before
    this.reattackMinRms = 0.01; // ...and loud enough in absolute terms that it isn't just noise-floor jitter
    this.state = "noNote";
    this.candidate = null; this.confirmed = null;
    this.matchFrames = 0; this.mismatchFrames = 0;
    this.lastRms = 0;
    this.onUpdate = null;
  }
  // A YIN attack-transient artifact is almost always an exact octave off the real note (a harmonic
  // briefly dominating), never some unrelated pitch — so an octave-related reading doesn't count as
  // disagreement at all; it's forgiven outright rather than just delayed.
  _isOctaveOf(a, b){ const diff = Math.abs(a-b); return diff !== 0 && diff % 12 === 0 && diff <= 24; }
  process(estimate){
    const rmsNow = estimate ? estimate.rms : 0;
    const sustaining = (this.state === "noteActive" || this.state === "possibleRelease");
    const gate = sustaining ? this.sustainConfidenceThreshold : this.onsetConfidenceThreshold;
    if (!estimate || estimate.confidence < gate){ this._weak(); this.lastRms = rmsNow; return; }
    const midi = freqToMidi(estimate.frequency);
    // The detector's frequency margin reaches a little past A0/C8 at the ends, but the keyboard only
    // has keys for MIDI 21-108 — anything outside that range can't be rendered, so treat it as noise.
    if (midi < 21 || midi > 108){ this._weak(); this.lastRms = rmsNow; return; }
    // Same pitch reappearing while we're still "active"/"maybe releasing" is ambiguous on pitch alone —
    // it could be the same held note, or a fresh re-strike of the same key. A sudden loudness jump means
    // it's a new hammer strike, so force the old note closed and start a brand new onset.
    if (sustaining && midi === this.confirmed && rmsNow > this.reattackMinRms && rmsNow > this.lastRms * this.reattackRatio){
      this.state = "noNote"; this.confirmed = null; this.candidate = null; this.matchFrames = 0; this.mismatchFrames = 0;
      this._emit(0, 0); // closes out the previous press
      this.candidate = midi; this.matchFrames = 1; this.state = "possibleNote";
      this.lastRms = rmsNow;
      this._emit(estimate.frequency, estimate.confidence);
      return;
    }
    switch(this.state){
      case "noNote":
        this.candidate = midi; this.matchFrames = 1; this.state = "possibleNote"; break;
      case "possibleNote":
        if (this.candidate === midi || this._isOctaveOf(midi, this.candidate)){
          this.matchFrames++;
          if (this.matchFrames >= this.framesToConfirmOnset){ this.confirmed = this.candidate; this.state = "noteActive"; }
        } else { this.candidate = midi; this.matchFrames = 1; }
        break;
      case "noteActive":
        if (this.confirmed === midi || this._isOctaveOf(midi, this.confirmed)){ this.mismatchFrames = 0; }
        else {
          this.mismatchFrames++;
          if (this.mismatchFrames >= this.framesToLeaveActive){ this.candidate = midi; this.matchFrames = 1; this.mismatchFrames = 0; this.state = "possibleNote"; }
        }
        break;
      case "possibleRelease":
        if (this.confirmed === midi || this._isOctaveOf(midi, this.confirmed)){ this.mismatchFrames = 0; this.state = "noteActive"; }
        else { this.candidate = midi; this.matchFrames = 1; this.state = "possibleNote"; }
        break;
    }
    this.lastRms = rmsNow;
    this._emit(estimate.frequency, estimate.confidence);
  }
  _weak(){
    switch(this.state){
      case "possibleNote": this.state = "noNote"; this.candidate = null; this.matchFrames = 0; break;
      case "noteActive": this.mismatchFrames = 1; this.state = "possibleRelease"; break;
      case "possibleRelease":
        this.mismatchFrames++;
        if (this.mismatchFrames >= this.framesToConfirmRelease){ this.state = "noNote"; this.confirmed = null; this.candidate = null; this.mismatchFrames = 0; }
        break;
    }
    this._emit(0, 0);
  }
  _emit(freq, conf){
    const note = (this.state === "noteActive" || this.state === "possibleRelease") ? this.confirmed : null;
    if (this.onUpdate) this.onUpdate({ state: this.state, midi: note, frequency: freq, confidence: conf, rms: this.lastRms });
  }
}

// ---------- PitchDetector: YIN algorithm ----------
class PitchDetector{
  constructor(minF=MIN_F, maxF=MAX_F, thresh=0.15, rmsGate=0.0012){
    this.minF=minF; this.maxF=maxF; this.thresh=thresh; this.rmsGate=rmsGate;
    this._scratchLen = 0; this._d = null; this._cmnd = null;
  }
  _scratch(len){
    if (this._scratchLen < len){ this._scratchLen = len; this._d = new Float32Array(len); this._cmnd = new Float32Array(len); }
    return [this._d, this._cmnd];
  }
  estimate(samples, sr){
    const n = samples.length;
    if (n <= 8) return null;
    const maxTau = Math.min(Math.floor(n/2), Math.floor(sr/this.minF));
    const minTau = Math.max(2, Math.floor(sr/this.maxF));
    if (maxTau <= minTau+1) return null;

    let rms=0; for (let i=0;i<n;i++) rms += samples[i]*samples[i];
    rms = Math.sqrt(rms/n);
    if (rms <= this.rmsGate) return null;

    const [d, cmnd] = this._scratch(maxTau+1);
    for (let tau=1; tau<=maxTau; tau++){
      let sum=0; const lim = n - tau;
      for (let j=0;j<lim;j++){ const diff = samples[j]-samples[j+tau]; sum += diff*diff; }
      d[tau] = sum;
    }
    cmnd[0]=1;
    let running=0;
    for (let tau=1; tau<=maxTau; tau++){
      running += d[tau];
      cmnd[tau] = running===0 ? 1 : d[tau]*tau/running;
    }
    let tauEst=-1;
    for (let tau=minTau; tau<=maxTau; tau++){
      if (cmnd[tau] < this.thresh){
        let t=tau;
        while (t+1<=maxTau && cmnd[t+1] < cmnd[t]) t++;
        tauEst = t; break;
      }
    }
    if (tauEst===-1){
      let bestTau=minTau, bestVal=cmnd[minTau];
      for (let t=minTau;t<=maxTau;t++){ if (cmnd[t]<bestVal){ bestVal=cmnd[t]; bestTau=t; } }
      tauEst = bestTau;
    }
    let refined = tauEst;
    if (tauEst>0 && tauEst<maxTau){
      const s0=cmnd[tauEst-1], s1=cmnd[tauEst], s2=cmnd[tauEst+1];
      const denom = s0+s2-2*s1;
      if (denom !== 0) refined = tauEst + 0.5*(s0-s2)/denom;
    }
    const freq = sr/refined;
    const conf = Math.max(0, Math.min(1, 1-cmnd[tauEst]));
    if (freq < this.minF*0.9 || freq > this.maxF*1.1) return null;
    return { frequency: freq, confidence: conf, rms: rms };
  }
}

// ---------- AudioManager: mic capture, ring buffer for live analysis, raw-chunk hook for recording ----------
class AudioManager{
  constructor(){
    this.ctx=null; this.stream=null; this.node=null; this.silentGain=null; this.running=false;
    this.ringCap = WINDOW_SIZE*3; this.ring=null; this.w=0;
    this.scratchWindow = new Float32Array(WINDOW_SIZE);
    this.pitchDetector = new PitchDetector();
    this.onEstimate=null; this.onRawChunk=null;
  }
  async start(){
    if (this.running) return;
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx({ latencyHint: "interactive" });
    if (this.ctx.state === "suspended") await this.ctx.resume();
    this.ring = new Float32Array(this.ringCap); this.w = 0;
    const source = this.ctx.createMediaStreamSource(this.stream);
    this.node = this.ctx.createScriptProcessor(HOP_SIZE, 1, 1);
    this.node.onaudioprocess = (e) => this._onBuffer(e.inputBuffer.getChannelData(0), this.ctx.sampleRate);
    this.silentGain = this.ctx.createGain(); this.silentGain.gain.value = 0;
    source.connect(this.node); this.node.connect(this.silentGain); this.silentGain.connect(this.ctx.destination);
    this.running = true;
  }
  stop(){
    if (!this.running) return;
    if (this.node){ this.node.onaudioprocess = null; this.node.disconnect(); }
    if (this.silentGain) this.silentGain.disconnect();
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = null; this.stream = null; this.node = null; this.running = false;
  }
  resumeIfNeeded(){ if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); }
  _onBuffer(input, sr){
    if (this.onRawChunk) this.onRawChunk(input);
    for (let i=0;i<input.length;i++){ this.ring[this.w] = input[i]; this.w = (this.w+1) % this.ringCap; }
    const n = WINDOW_SIZE;
    const win = this.scratchWindow;
    let r = (this.w - n + this.ringCap*2) % this.ringCap;
    for (let i=0;i<n;i++){ win[i] = this.ring[r]; r = (r+1) % this.ringCap; }
    const est = this.pitchDetector.estimate(win, sr);
    if (this.onEstimate) this.onEstimate(est);
  }
}

// ---------- Offline analysis: reuse the same PitchDetector + NoteDetector on a full recording ----------
function analyzeOffline(samples, sr){
  const pd = new PitchDetector();
  const nd = new NoteDetector();
  const segs = []; let current = null, t = 0;
  const close = (endT) => { segs.push({ midi: current.midi, start: current.start, end: endT, peak: current.peak }); };
  nd.onUpdate = (out) => {
    if (out.midi != null){
      if (!current || current.midi !== out.midi){
        if (current) close(t);
        current = { midi: out.midi, start: t, peak: 0 };
      }
      if (out.rms > current.peak) current.peak = out.rms;
    } else if (current){ close(t); current = null; }
  };
  for (let pos = WINDOW_SIZE; pos <= samples.length; pos += HOP_SIZE){
    t = pos / sr;
    nd.process(pd.estimate(samples.subarray(pos-WINDOW_SIZE, pos), sr));
  }
  if (current) close(samples.length/sr);
  // How hard each note was played, relative to the loudest note in this recording (0.25 .. 1).
  const maxPeak = segs.reduce((m, sg) => Math.max(m, sg.peak), 0) || 1;
  segs.forEach(sg => { sg.vel = Math.min(1, Math.max(0.25, Math.sqrt(sg.peak / maxPeak))); });
  return segs;
}

// Same analysis, but it pauses every few hundred milliseconds so the screen keeps updating and can show
// progress. Used for longer clips (imported files), where the sync version would freeze the page.
async function analyzeOfflineAsync(samples, sr, onProgress){
  const pd = new PitchDetector();
  const nd = new NoteDetector();
  const segs = []; let current = null, t = 0;
  const close = (endT) => { segs.push({ midi: current.midi, start: current.start, end: endT, peak: current.peak }); };
  nd.onUpdate = (out) => {
    if (out.midi != null){
      if (!current || current.midi !== out.midi){
        if (current) close(t);
        current = { midi: out.midi, start: t, peak: 0 };
      }
      if (out.rms > current.peak) current.peak = out.rms;
    } else if (current){ close(t); current = null; }
  };
  let lastYield = performance.now();
  for (let pos = WINDOW_SIZE; pos <= samples.length; pos += HOP_SIZE){
    t = pos / sr;
    nd.process(pd.estimate(samples.subarray(pos-WINDOW_SIZE, pos), sr));
    if (performance.now() - lastYield > 120){
      if (onProgress) onProgress(Math.round(100 * pos / samples.length));
      await new Promise(r => setTimeout(r, 0));
      lastYield = performance.now();
    }
  }
  if (current) close(samples.length/sr);
  const maxPeak = segs.reduce((m, sg) => Math.max(m, sg.peak), 0) || 1;
  segs.forEach(sg => { sg.vel = Math.min(1, Math.max(0.25, Math.sqrt(sg.peak / maxPeak))); });
  return segs;
}

function encodeWAV(samples, sampleRate){
  const buf = new ArrayBuffer(44 + samples.length*2);
  const view = new DataView(buf);
  const writeStr = (o,s) => { for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  writeStr(0,"RIFF"); view.setUint32(4, 36+samples.length*2, true); writeStr(8,"WAVE");
  writeStr(12,"fmt "); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
  view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true);
  writeStr(36,"data"); view.setUint32(40, samples.length*2, true);
  let off=44;
  for (let i=0;i<samples.length;i++){ const s=Math.max(-1,Math.min(1,samples[i])); view.setInt16(off, s<0? s*0x8000 : s*0x7FFF, true); off+=2; }
  return new Blob([view], {type:"audio/wav"});
}

// ---------- Full 88-key keyboard (A0-C8), always stretched edge to edge ----------
// Every key is positioned in PERCENT of the keyboard's width, so the whole piano fits any screen (phone,
// tablet, portrait or landscape) with no scrolling and no resize code. keyX holds each key's percent
// position so the falling notes line up with the keys exactly.
const START_MIDI = 21, END_MIDI = 108; // A0 .. C8
function isWhite(m){ return ![1,3,6,8,10].includes(((m%12)+12)%12); }

const keyboardEl = document.getElementById("keyboard");
const rollEl = document.getElementById("roll");
const whiteMidis = []; for (let m=START_MIDI;m<=END_MIDI;m++) if (isWhite(m)) whiteMidis.push(m);
const whiteEls = {}, blackEls = {}, keyX = {};

function buildKeyboard(){
  keyboardEl.innerHTML = "";
  const w = 100 / whiteMidis.length;
  whiteMidis.forEach((m, i) => {
    const left = i * w;
    const el = document.createElement("div");
    el.className = "wkey"; el.style.left = left+"%"; el.style.width = w+"%";
    if (m % 12 === 0){ const span = document.createElement("span"); span.textContent = midiToName(m); el.appendChild(span); }
    keyboardEl.appendChild(el);
    whiteEls[m] = el; keyX[m] = { left, width: w };
  });
  let wi = -1; const bw = w * 0.62;
  for (let m=START_MIDI; m<=END_MIDI; m++){
    if (isWhite(m)){ wi++; continue; }
    const left = (wi+1)*w - bw/2;
    const el = document.createElement("div");
    el.className = "bkey"; el.style.left = left+"%"; el.style.width = bw+"%";
    keyboardEl.appendChild(el);
    blackEls[m] = el; keyX[m] = { left, width: bw };
  }
}
function setActiveKeys(midis){
  Object.values(whiteEls).forEach(el => el.classList.remove("active"));
  Object.values(blackEls).forEach(el => el.classList.remove("active"));
  midis.forEach(m => { const el = whiteEls[m] || blackEls[m]; if (el) el.classList.add("active"); });
}

// ---------- Piano synth: plays the DETECTED notes as piano sound (not the original recording) ----------
// Each note is a few sine partials (slightly stretched like real piano strings) with a fast attack and a long
// exponential decay, so the pitch is clear even on a phone speaker. Higher partials fade faster, which gives the
// mellowing a struck string has. Low notes get stronger upper partials because phone speakers can't reproduce
// their fundamentals.
class PianoSynth{
  constructor(ctx){
    this.ctx = ctx;
    this.out = ctx.createGain(); this.out.gain.value = 0.6;
    const comp = ctx.createDynamicsCompressor();
    this.out.connect(comp); comp.connect(ctx.destination);
    this.bus = ctx.createGain(); this.bus.connect(this.out);
  }
  noteOn(midi, when, dur, vel){
    const ctx = this.ctx;
    const f0 = 440 * Math.pow(2, (midi - 69) / 12);
    const t0 = Math.max(when, ctx.currentTime + 0.005);
    const end = Math.max(when + dur, t0 + 0.12);            // never shorter than a short, clean blip
    const tau = Math.min(3, Math.max(0.35, 1.4 * Math.pow(2, -(midi - 60) / 20))); // low notes ring longer
    const peak = 0.08 + 0.28 * vel * vel;                    // harder-played notes are louder

    const decay = ctx.createGain();
    decay.gain.setValueAtTime(0.0001, t0);
    decay.gain.linearRampToValueAtTime(peak, t0 + 0.004);
    decay.gain.setTargetAtTime(peak * 0.03, t0 + 0.004, tau);
    const release = ctx.createGain();                        // fades the note out when the detected note ended
    release.gain.setValueAtTime(1, t0);
    release.gain.setTargetAtTime(0, end, 0.06);
    decay.connect(release); release.connect(this.bus);

    const partials = [1, 0.5, 0.28, 0.16, 0.09, 0.05];
    const B = 0.0002; // tiny inharmonicity
    partials.forEach((amp, i) => {
      const h = i + 1;
      const fr = f0 * h * Math.sqrt(1 + B * h * h);
      if (fr > 10000) return;
      const boost = f0 < 220 ? 1 + (h - 1) * 0.45 : 1;
      const osc = ctx.createOscillator(); osc.type = "sine"; osc.frequency.value = fr;
      const g = ctx.createGain();
      g.gain.setValueAtTime(amp * boost, t0);
      g.gain.setTargetAtTime(amp * boost * 0.1, t0, tau / (1 + 0.7 * i));
      osc.connect(g); g.connect(decay);
      osc.start(t0); osc.stop(end + 0.6);
    });
  }
  // Silences everything currently sounding or scheduled (pause / stop / seek).
  stopAll(){
    const old = this.bus;
    try{ old.gain.setTargetAtTime(0, this.ctx.currentTime, 0.02); }catch(e){}
    setTimeout(() => { try{ old.disconnect(); }catch(e){} }, 250);
    this.bus = this.ctx.createGain(); this.bus.connect(this.out);
  }
}

// ---------- Chord detection (polyphonic) ----------
// Uses Basic Pitch, a small open-source neural network by Spotify (Apache-2.0) trained to hear several notes at
// once. It runs entirely on the device (about 1 MB model + the TensorFlow.js runtime, downloaded once from the
// jsDelivr CDN and then cached by the browser). Audio is converted to 22,050 Hz mono, which the model expects.
// The thresholds and the two clean-up filters below were tuned on real-piano test audio (chords, melody with
// accompaniment, fast pedalled arpeggios, repeated notes).
const BP_BASE = "https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/";
const BP_SETTINGS = {
  onset: 0.6, frame: 0.2, minLenFrames: 5,      // model thresholds
  mergeGap: 0.12, mergeOnset: 0.5,               // re-join a held note the model split in two
  ghostWin: 0.06, ghostRatio: 0.75, subRatio: 0.5 // drop quiet overtone "ghost" notes an octave away
};
const BP_FPS = 22050 / 256; // model output frames per second
let bpModulePromise = null, bpInstance = null, bpWarm = null;
function loadChordModel(){
  if (!bpModulePromise){
    bpModulePromise = import(BP_BASE + "+esm").then(mod => {
      bpInstance = new mod.BasicPitch(BP_BASE + "model/model.json");
      return bpInstance.model.then(() => mod); // wait until the network itself has downloaded
    });
    bpModulePromise.catch(() => { bpModulePromise = null; bpInstance = null; bpWarm = null; }); // allow a retry later
  }
  return bpModulePromise;
}
// The first run on a page is slow (the graphics chip compiles the model). Doing it once in the background on
// silence makes the first real analysis fast.
function warmChordModel(){
  if (!bpWarm){
    bpWarm = loadChordModel().then(() => bpInstance.evaluateModel(new Float32Array(22050), () => {}, () => {}));
    bpWarm.catch(() => { bpWarm = null; });
  }
  return bpWarm;
}
function resampleTo22050(samples, sr){
  if (sr === 22050) return Promise.resolve(samples);
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const len = Math.ceil(samples.length * 22050 / sr);
  const oc = new OC(1, len, 22050);
  const buf = oc.createBuffer(1, samples.length, sr);
  buf.getChannelData(0).set(samples);
  const src = oc.createBufferSource(); src.buffer = buf; src.connect(oc.destination); src.start(0);
  return new Promise((res, rej) => {
    oc.oncomplete = e => res(e.renderedBuffer.getChannelData(0).slice());
    const p = oc.startRendering();
    if (p && p.then) p.then(b => res(b.getChannelData(0).slice()), rej);
  });
}
// Clean-up after the model: (1) a held note the model split in two, with no real new attack, is joined back;
// (2) a quiet note exactly an octave / octave+fifth / two octaves above, or an octave below, a louder note that
// starts at the same moment is an overtone, not a key that was pressed, so it's removed.
function cleanChordNotes(notes, onsets, st){
  const onsetAt = n => { const f = Math.round(n.start * BP_FPS), k = n.midi - 21; let mx = 0;
    for (let i = Math.max(0, f - 2); i <= Math.min(onsets.length - 1, f + 2); i++) mx = Math.max(mx, onsets[i][k]); return mx; };
  let ns = notes.map(n => Object.assign({}, n, { on: onsetAt(n) }));
  ns.sort((a, b) => a.midi - b.midi || a.start - b.start);
  const merged = [];
  for (const n of ns){
    const prev = merged.length && merged[merged.length - 1];
    if (prev && prev.midi === n.midi && n.start - prev.end <= st.mergeGap && n.on < st.mergeOnset){
      prev.end = Math.max(prev.end, n.end); prev.peak = Math.max(prev.peak, n.peak); continue;
    }
    merged.push(n);
  }
  ns = merged;
  const drop = new Set();
  ns.forEach((n, i) => ns.forEach((m, j) => {
    if (i === j || drop.has(j) || Math.abs(n.start - m.start) > st.ghostWin) return;
    const d = n.midi - m.midi;
    if ((d === 12 || d === 19 || d === 24) && n.peak < m.peak * st.ghostRatio) drop.add(i);
    if (d === -12 && n.peak < m.peak * st.subRatio) drop.add(i);
  }));
  return ns.filter((n, i) => !drop.has(i));
}
// Returns note segments in the shape the rest of the app uses: { midi, start, end, peak, vel }.
async function transcribeChords(samples, sr, onProgress, settings){
  const st = Object.assign({}, BP_SETTINGS, settings || {});
  const mod = await loadChordModel();
  const x = await resampleTo22050(samples, sr);
  const frames = [], onsets = [], contours = [];
  await bpInstance.evaluateModel(x, (f, o, c) => { frames.push(...f); onsets.push(...o); contours.push(...c); },
    p => { if (onProgress) onProgress(Math.round(100 * Math.min(1, p))); });
  const events = mod.noteFramesToTime(mod.outputToNotesPoly(frames, onsets, st.onset, st.frame, st.minLenFrames));
  let segs = events
    .filter(n => n.pitchMidi >= 21 && n.pitchMidi <= 108)
    .map(n => ({ midi: n.pitchMidi, start: n.startTimeSeconds, end: n.startTimeSeconds + n.durationSeconds, peak: n.amplitude }));
  segs = cleanChordNotes(segs, onsets, st);
  const maxPeak = segs.reduce((m, sg) => Math.max(m, sg.peak), 0) || 1;
  segs.forEach(sg => { delete sg.on; sg.vel = Math.min(1, Math.max(0.25, Math.sqrt(sg.peak / maxPeak))); });
  segs.sort((a, b) => a.start - b.start || a.midi - b.midi);
  return segs;
}

function fmtTime(sec){ const m = Math.floor(sec / 60), s = sec - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(s % 1 ? 1 : 0); }
// Accepts "83", "83.5", "1:23" or "1:23.5".
function parseTime(str){
  str = String(str).trim().replace(",", ".");
  if (!str) return NaN;
  const parts = str.split(":");
  if (parts.length > 2 || parts.some(p => p === "" || isNaN(p))) return NaN;
  return parts.length === 2 ? parseFloat(parts[0]) * 60 + parseFloat(parts[1]) : parseFloat(parts[0]);
}
function decodeAudio(ctx, arr){

    const p = ctx.decodeAudioData(arr, res, rej); // callback form also works on older Safari
    if (p && p.then) p.then(res, rej);
  });
}
function readFile(f){
  if (f.arrayBuffer) return f.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(f); });
}

  if (recording || analyzing) return;
  stopPlayback();
  fileInput.value = "";
  fileInput.click();
};
fileInput.onchange = async () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  recStatus.style.color = "var(--muted)"; recStatus.textContent = "Opening " + f.name + "…";
  setBusy(true);
  try{
    const ctx = ensureAudio();
    importedBuffer = await decodeAudio(ctx, await readFile(f));
  }catch(e){
    importedBuffer = null; importRow.style.display = "none";
    recStatus.style.color = "#ff5c7a";
    recStatus.textContent = "Couldn't read that file. Try an audio file (MP3, M4A, WAV) or a video (MP4, MOV).";
    return;
  }finally{ setBusy(false); }
  const dur = importedBuffer.duration;
  importName.textContent = f.name + " (" + fmtTime(Math.floor(dur)) + ")";
  importStart.value = "0:00";
  importEnd.value = fmtTime(Math.floor(Math.min(dur, 30)));
  importRow.style.display = "flex";
  recStatus.textContent = "Choose which part to analyze, then tap Analyze.";
};
analyzeBtn.onclick = async () => {
  if (!importedBuffer || analyzing) return;
  const dur = importedBuffer.duration;
  let a = parseTime(importStart.value), b = parseTime(importEnd.value);
  const bad = msg => { recStatus.style.color = "#ff5c7a"; recStatus.textContent = msg; };
  if (isNaN(a) || isNaN(b)) return bad("Write times like 1:05 or 65.");
  b = Math.min(b, dur);
  if (a < 0 || a >= dur) return bad("The start is past the end of the file (" + fmtTime(Math.floor(dur)) + ").");
  if (b <= a) return bad("The end has to be after the start.");
  if (b - a > MAX_IMPORT_SECONDS) return bad("Choose at most " + (MAX_IMPORT_SECONDS / 60) + " minutes at a time.");
  // Mix the chosen part down to one channel.
  const sr = importedBuffer.sampleRate;
  const i0 = Math.floor(a * sr), i1 = Math.floor(b * sr), n = i1 - i0;
  const mono = new Float32Array(n);
  const chs = importedBuffer.numberOfChannels;
  for (let c = 0; c < chs; c++){
    const d = importedBuffer.getChannelData(c);
    for (let i = 0; i < n; i++) mono[i] += d[i0 + i] / chs;
  }
  await loadTake(mono, sr);
};

// ---------- Real piano samples ----------
// Recordings of a real grand piano (Salamander Grand Piano by Alexander Holm, CC BY 3.0, hosted by Tone.js).
// The set has one recorded note every 3 semitones (C, D#, F#, A in every octave, A0-C8). Each detected note is
// played from the nearest recording, pitch-shifted by at most 1.5 semitones, which is inaudible as a change in
// timbre. Only the recordings a take actually needs are downloaded, and they're kept for the rest of the session.
const SAMPLE_BASE = "https://tonejs.github.io/audio/salamander/";
const SAMPLE_MIDIS = []; for (let m = 21; m <= 108; m++) if ([0,3,6,9].includes(m % 12)) SAMPLE_MIDIS.push(m);
const SAMPLE_FILE_NAMES = ["C","Cs","D","Ds","E","F","Fs","G","Gs","A","As","B"];
function sampleFileFor(m){ return SAMPLE_FILE_NAMES[m % 12] + (Math.floor(m / 12) - 1) + ".mp3"; }
function nearestSample(m){ let best = SAMPLE_MIDIS[0]; for (const s of SAMPLE_MIDIS) if (Math.abs(s - m) < Math.abs(best - m)) best = s; return best; }

class PianoSampler{
  constructor(ctx){
    this.ctx = ctx;
    this.buffers = new Map();   // sample midi -> AudioBuffer
    this.pending = new Map();   // sample midi -> Promise
    this.out = ctx.createGain(); this.out.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    this.out.connect(comp); comp.connect(ctx.destination);
    this.bus = ctx.createGain(); this.bus.connect(this.out);
  }
  _decode(arr){
    return new Promise((res, rej) => {
      const p = this.ctx.decodeAudioData(arr, res, rej); // callback form also works on older Safari
      if (p && p.then) p.then(res, rej);
    });
  }
  _loadOne(sm){
    if (this.buffers.has(sm)) return Promise.resolve();
    if (!this.pending.has(sm)){
      const pr = fetch(SAMPLE_BASE + sampleFileFor(sm))
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
        .then(a => this._decode(a))
        .then(b => { this.buffers.set(sm, b); })
        .finally(() => this.pending.delete(sm));
      this.pending.set(sm, pr);
    }
    return this.pending.get(sm);
  }
  // Downloads the recordings needed for these notes. Resolves when all are ready; rejects if any failed.
  load(midis){
    const need = [...new Set(midis.map(nearestSample))];
    return Promise.all(need.map(sm => this._loadOne(sm)));
  }
  has(midi){ return this.buffers.has(nearestSample(midi)); }
  noteOn(midi, when, dur, vel){
    const sm = nearestSample(midi);
    const buf = this.buffers.get(sm);
    if (!buf) return false;
    const ctx = this.ctx;
    const t0 = Math.max(when, ctx.currentTime + 0.005);
    const end = Math.max(when + dur, t0 + 0.15);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = Math.pow(2, (midi - sm) / 12);
    const g = ctx.createGain();
    const level = 0.2 + 0.8 * vel * vel;          // how hard the note was played
    g.gain.setValueAtTime(level, t0);
    g.gain.setTargetAtTime(0, end, 0.12);         // the damper: fade out when the detected note ended
    src.connect(g); g.connect(this.bus);
    src.start(t0);
    src.stop(Math.min(end + 1, t0 + buf.duration / src.playbackRate.value));
    return true;
  }
  stopAll(){
    const old = this.bus;
    try{ old.gain.setTargetAtTime(0, this.ctx.currentTime, 0.02); }catch(e){}
    setTimeout(() => { try{ old.disconnect(); }catch(e){} }, 250);
    this.bus = this.ctx.createGain(); this.bus.connect(this.out);
  }
}

// ---------- Playback engine ----------
// One clock drives both the sound and the falling notes. In "piano" mode the clock is the AudioContext's own
// time (scaled by the speed); in "original" mode it's the <audio> element's currentTime.
const player = {
  sound: "piano",            // "piano" | "original"
  playing: false,
  ctx: null, synth: null, sampler: null,
  useSamples: false,         // true once the real piano recordings for this take are loaded
  loading: false,
  clipPos: 0,                // seconds into the clip while paused (piano mode)
  anchorClip: 0, anchorCtx: 0, rate: 1,
  schedIdx: 0, timer: null,
  endTime: 0
};
function setAudioSession(type){ try{ if (navigator.audioSession) navigator.audioSession.type = type; }catch(e){} }
function ensureAudio(){
  if (!player.ctx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    player.ctx = new Ctx({ latencyHint: "interactive" });
    player.synth = new PianoSynth(player.ctx);
    player.sampler = new PianoSampler(player.ctx);
  }
  return player.ctx;
}
function clipNow(){
  if (player.sound === "original") return playbackAudio.currentTime;
  if (!player.playing || !player.ctx) return player.clipPos;
  return player.anchorClip + (player.ctx.currentTime - player.anchorCtx) * player.rate;
}
// Look-ahead scheduler: every 25 ms, hand the synth the notes that start within the next 150 ms.
function schedulePiano(){
  if (!player.playing || player.sound !== "piano") return;
  if (clipNow() > player.endTime){ stopPlayback(); return; }
  const horizon = player.ctx.currentTime + 0.15;
  while (player.schedIdx < noteSegments.length){
    const seg = noteSegments[player.schedIdx];
    const when = player.anchorCtx + (seg.start - player.anchorClip) / player.rate;
    if (when > horizon) break;
    const d = (seg.end - seg.start) / player.rate, v = seg.vel || 0.7;
    if (!(player.useSamples && player.sampler.noteOn(seg.midi, when, d, v))) player.synth.noteOn(seg.midi, when, d, v);
    player.schedIdx++;
  }
}
// Starts downloading the piano recordings for the current take (in the background, no sound yet).
function preloadSamples(){
  if (!noteSegments.length) return Promise.resolve(false);
  ensureAudio();
  const midis = noteSegments.map(sg => sg.midi);
  return player.sampler.load(midis).then(() => true, () => false);
}
async function startPlayback(){
  if (player.playing || player.loading) return;
  setAudioSession("playback"); // lets sound play even with the iPhone's silent switch on (Safari 16.4+)
  playBtn.textContent = "⏸ Pause";
  player.playing = true;
  try{
    if (player.sound === "original"){
      await playbackAudio.play();
    } else {
      if (!noteSegments.length) throw new Error("no detected notes to play — switch to “Original recording”.");
      const ctx = ensureAudio();
      const resumed = ctx.state !== "running" ? ctx.resume() : null; // must start inside the tap on iOS
      if (!noteSegments.every(sg => player.sampler.has(sg.midi))){
        player.loading = true;
        recStatus.textContent = "Loading piano sounds\u2026"; recStatus.style.color = "var(--muted)";
        player.useSamples = await preloadSamples();
        player.loading = false;
        recStatus.textContent = player.useSamples ? "Playing with real piano sounds."
          : "Couldn't download piano sounds (offline?) \u2014 using the built-in piano sound.";
      } else player.useSamples = true;
      if (!player.playing) return; // stopped while loading
      if (resumed) await resumed;
      player.rate = parseFloat(speedSlider.value);
      player.anchorClip = player.clipPos; player.anchorCtx = ctx.currentTime;
      const i = noteSegments.findIndex(sg => sg.end > player.clipPos);
      player.schedIdx = i === -1 ? noteSegments.length : i;
      player.timer = setInterval(schedulePiano, 25);
      schedulePiano();
    }
    startRenderLoop();
  }catch(err){
    player.playing = false; playBtn.textContent = "▶ Play";
    recStatus.textContent = "Playback couldn't start: " + err.message; recStatus.style.color = "#ff5c7a";
  }
}
function pausePlayback(){
  if (player.loading){ player.playing = false; playBtn.textContent = "\u25B6 Play"; return; }
  if (!player.playing) return;
  if (player.sound === "original"){ playbackAudio.pause(); }
  else {
    player.clipPos = clipNow();
    clearInterval(player.timer); player.timer = null;
    if (player.synth) player.synth.stopAll();
    if (player.sampler) player.sampler.stopAll();
  }
  player.playing = false;
  playBtn.textContent = "▶ Play";
}
function stopPlayback(){
  pausePlayback();
  player.clipPos = 0;
  try{ playbackAudio.currentTime = 0; }catch(e){}
  setAudioSession("auto");
  playBtn.textContent = "▶ Play";
  if (noteSegments.length) updateRoll(0); // reset the notes to their starting positions instead of leaving them frozen
  setActiveKeys([]);
}
function setSound(snd){
  if (player.sound === snd) return;
  stopPlayback();
  player.sound = snd;
  soundPianoBtn.classList.toggle("active", snd === "piano");
  soundOrigBtn.classList.toggle("active", snd === "original");
}

const soundRow = document.getElementById("soundRow");
const soundPianoBtn = document.getElementById("soundPianoBtn");
const soundOrigBtn = document.getElementById("soundOrigBtn");
soundPianoBtn.onclick = () => setSound("piano");
soundOrigBtn.onclick = () => setSound("original");

// Playback speed: in original mode the audio's playbackRate changes; in piano mode the clock's rate does.
// Either way the falling notes follow the same clock, so they speed up / slow down with the sound.
const speedRow = document.getElementById("speedRow");
const speedSlider = document.getElementById("speedSlider");
const speedVal = document.getElementById("speedVal");
speedSlider.oninput = () => {
  const rate = parseFloat(speedSlider.value);
  playbackAudio.playbackRate = rate;
  speedVal.textContent = rate + "x";
  if (player.playing && player.sound === "piano"){
    player.anchorClip = clipNow(); player.anchorCtx = player.ctx.currentTime; // re-anchor so the position doesn't jump
  }
  player.rate = rate;
};

playBtn.onclick = () => { if (player.playing) pausePlayback(); else startPlayback(); };
restartBtn.onclick = () => { stopPlayback(); startPlayback(); };
playbackAudio.onended = () => { if (player.sound === "original") stopPlayback(); };

const NOTE_COLORS = ["#ff5c7a","#ff8a5c","#ffcf5c","#c8e05c","#6be07a","#4be0c2","#4bb8e0","#4b8fe0","#6b6bff","#a45cff","#e05cd9","#e05c8f"];
let rafActive = false;
function startRenderLoop(){ if (!rafActive){ rafActive = true; requestAnimationFrame(renderFrame); } }
function renderFrame(){
  if (!player.playing){ rafActive = false; return; }
  updateRoll(clipNow());
  requestAnimationFrame(renderFrame);
}
// Draws every falling note for time t (seconds into the clip). t comes from the playback clock (clipNow()),
// so the notes stay in sync with the sound at any playback speed.
function updateRoll(t){
  const hitLine = rollEl.clientHeight;
  const pxPerSec = Math.max(60, hitLine / 3); // about 3 seconds of upcoming notes are visible on any screen size
  const active = [];
  noteSegments.forEach(seg => {
    const kx = keyX[seg.midi];
    if (!kx) return; // safety net: a segment with no matching key on the keyboard is skipped, not fatal
    const bottom = hitLine + (t - seg.start) * pxPerSec;
    const height = Math.max(14, (seg.end - seg.start) * pxPerSec);
    const top = bottom - height;
    let el = segEls.get(seg);
    if (bottom < -40 || top > hitLine + 40){ if (el) el.style.display = "none"; return; }
    if (!el){
      el = document.createElement("div"); el.className = "fnote";
      el.style.left = "calc(" + kx.left + "% + 1px)"; el.style.width = "calc(" + kx.width + "% - 2px)";
      el.style.background = NOTE_COLORS[((seg.midi%12)+12)%12];
      rollEl.appendChild(el); segEls.set(seg, el);
    }
    el.style.display = "block"; el.style.top = top+"px"; el.style.height = height+"px";
    if (t >= seg.start && t <= seg.end) active.push(seg.midi);
  });
  setActiveKeys(active);
}

// Redraw the notes whenever the falling-notes area changes size (rotating the phone, a status line wrapping...).
function redrawRollIfNeeded(){ if (mode === "record" && noteSegments.length) updateRoll(clipNow()); }
if (window.ResizeObserver) new ResizeObserver(redrawRollIfNeeded).observe(rollEl);
else window.addEventListener("resize", redrawRollIfNeeded);
</script>
</body>
