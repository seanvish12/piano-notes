<style>
:root{
  --bg:#f5f5f7; --fg:#141418; --muted:#6b6b76; --accent:#5865f2;
  --key-white:#ffffff; --key-black:#141418; --key-border:rgba(0,0,0,.28); --panel:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:inherit}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14141c; --fg:#f2f2f5; --muted:#9a9aa5; --accent:#7c86ff;
    --key-white:#e8e8ee; --key-black:#0a0a10; --key-border:rgba(255,255,255,.25); --panel:#1d1d27;
  }
}
:root[data-theme="dark"]{
  --bg:#14141c; --fg:#f2f2f5; --muted:#9a9aa5; --accent:#7c86ff;
  --key-white:#e8e8ee; --key-black:#0a0a10; --key-border:rgba(255,255,255,.25); --panel:#1d1d27;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;align-items:center;min-height:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));gap:14px}
h1{font-size:17px;font-weight:600;margin:6px 0 0;letter-spacing:.2px}
.readout{text-align:center}
.readout .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.readout .note{font-size:52px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.readout .freq{font-size:15px;color:var(--muted);min-height:1.2em}
.debug{width:100%;max-width:420px;background:var(--panel);border-radius:12px;padding:10px 14px;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.debug b{color:var(--fg)}
#startBtn{appearance:none;border:none;border-radius:999px;padding:14px 30px;font-size:16px;font-weight:600;background:var(--accent);color:#fff;min-width:200px}
#startBtn:active{opacity:.85}
#startBtn.listening{background:#e5484d}
#permError{display:none;width:100%;max-width:420px;background:var(--panel);border-radius:12px;padding:16px;text-align:center;gap:10px;flex-direction:column}
#permError p{margin:0;color:var(--muted);font-size:14px}
#retryBtn{appearance:none;border:none;border-radius:999px;padding:10px 22px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
#keyboard{position:relative;width:100%;max-width:520px;height:150px;margin-top:auto}
.wkey{position:absolute;top:0;bottom:0;background:var(--key-white);border:1px solid var(--key-border);border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;transition:background .06s ease}
.wkey span{font-size:11px;color:var(--muted)}
.wkey.active{background:var(--accent)}
.wkey.active span{color:#fff}
.bkey{position:absolute;top:0;height:62%;background:var(--key-black);border-radius:0 0 4px 4px;z-index:2;transition:background .06s ease}
.bkey.active{background:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <h1>Piano Note Detector</h1>

  <div class="readout">
    <div class="label">Detected</div>
    <div class="note" id="noteOut">&mdash;</div>
    <div class="freq" id="freqOut">&nbsp;</div>
  </div>

  <div class="debug" id="debugOut">
    Listening: <b>NO</b><br>
    Confidence: <b>0.00</b><br>
    State: <b>idle</b>
  </div>

  <button id="startBtn">Start Listening</button>

  <div id="permError">
    <p>Microphone access is required to detect piano notes.</p>
    <button id="retryBtn">Try Again</button>
  </div>

  <div id="keyboard"></div>
</div>

<script>
// ---------- NoteDetector: frequency -> stable MIDI note (onset/release state machine) ----------
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function midiToName(m){ return NOTE_NAMES[((m%12)+12)%12] + (Math.floor(m/12)-1); }
function freqToMidi(f){ return Math.round(69 + 12*Math.log2(f/440)); }

class NoteDetector{
  constructor(){
    this.confidenceThreshold = 0.55;
    this.framesToConfirmOnset = 3;
    this.framesToConfirmRelease = 6;
    this.state = "noNote";
    this.candidate = null;
    this.confirmed = null;
    this.matchFrames = 0;
    this.mismatchFrames = 0;
    this.onUpdate = null;
  }
  process(estimate){
    if (!estimate || estimate.confidence < this.confidenceThreshold){ this._weak(); return; }
    const midi = freqToMidi(estimate.frequency);
    switch(this.state){
      case "noNote":
        this.candidate = midi; this.matchFrames = 1; this.state = "possibleNote"; break;
      case "possibleNote":
        if (this.candidate === midi){
          this.matchFrames++;
          if (this.matchFrames >= this.framesToConfirmOnset){ this.confirmed = this.candidate; this.state = "noteActive"; }
        } else { this.candidate = midi; this.matchFrames = 1; }
        break;
      case "noteActive":
        if (this.confirmed === midi){ this.mismatchFrames = 0; }
        else {
          this.mismatchFrames++;
          if (this.mismatchFrames >= 2){ this.candidate = midi; this.matchFrames = 1; this.mismatchFrames = 0; this.state = "possibleNote"; }
        }
        break;
      case "possibleRelease":
        if (this.confirmed === midi){ this.mismatchFrames = 0; this.state = "noteActive"; }
        else { this.candidate = midi; this.matchFrames = 1; this.state = "possibleNote"; }
        break;
    }
    this._emit(estimate.frequency, estimate.confidence);
  }
  _weak(){
    switch(this.state){
      case "possibleNote": this.state = "noNote"; this.candidate = null; this.matchFrames = 0; break;
      case "noteActive": this.mismatchFrames = 1; this.state = "possibleRelease"; break;
      case "possibleRelease":
        this.mismatchFrames++;
        if (this.mismatchFrames >= this.framesToConfirmRelease){ this.state = "noNote"; this.confirmed = null; this.candidate = null; this.mismatchFrames = 0; }
        break;
    }
    this._emit(0, 0);
  }
  _emit(freq, conf){
    const note = (this.state === "noteActive" || this.state === "possibleRelease") ? this.confirmed : null;
    if (this.onUpdate) this.onUpdate({ state: this.state, midi: note, frequency: freq, confidence: conf });
  }
}

// ---------- PitchDetector: YIN algorithm (finds the fundamental, not just the loudest FFT bin) ----------
class PitchDetector{
  constructor(minF=75, maxF=1100, thresh=0.15){ this.minF=minF; this.maxF=maxF; this.thresh=thresh; }
  estimate(samples, sr){
    const n = samples.length;
    if (n <= 8) return null;
    const maxTau = Math.min(Math.floor(n/2), Math.floor(sr/this.minF));
    const minTau = Math.max(2, Math.floor(sr/this.maxF));
    if (maxTau <= minTau+1) return null;

    let rms=0; for (let i=0;i<n;i++) rms += samples[i]*samples[i];
    rms = Math.sqrt(rms/n);
    if (rms <= 0.003) return null;

    const d = new Float32Array(maxTau+1);
    for (let tau=1; tau<=maxTau; tau++){
      let sum=0; const lim = n - tau;
      for (let j=0;j<lim;j++){ const diff = samples[j]-samples[j+tau]; sum += diff*diff; }
      d[tau] = sum;
    }
    const cmnd = new Float32Array(maxTau+1); cmnd[0]=1;
    let running=0;
    for (let tau=1; tau<=maxTau; tau++){
      running += d[tau];
      cmnd[tau] = running===0 ? 1 : d[tau]*tau/running;
    }
    let tauEst=-1;
    for (let tau=minTau; tau<=maxTau; tau++){
      if (cmnd[tau] < this.thresh){
        let t=tau;
        while (t+1<=maxTau && cmnd[t+1] < cmnd[t]) t++;
        tauEst = t; break;
      }
    }
    if (tauEst===-1){
      let bestTau=minTau, bestVal=cmnd[minTau];
      for (let t=minTau;t<=maxTau;t++){ if (cmnd[t]<bestVal){ bestVal=cmnd[t]; bestTau=t; } }
      tauEst = bestTau;
    }
    let refined = tauEst;
    if (tauEst>0 && tauEst<maxTau){
      const s0=cmnd[tauEst-1], s1=cmnd[tauEst], s2=cmnd[tauEst+1];
      const denom = s0+s2-2*s1;
      if (denom !== 0) refined = tauEst + 0.5*(s0-s2)/denom;
    }
    const freq = sr/refined;
    const conf = Math.max(0, Math.min(1, 1-cmnd[tauEst]));
    if (freq < this.minF*0.9 || freq > this.maxF*1.1) return null;
    return { frequency: freq, confidence: conf };
  }
}

// ---------- AudioManager: mic capture, ring buffer, hands windows to PitchDetector ----------
// Uses a ScriptProcessorNode rather than an AudioWorklet: this artifact is hosted inside a
// sandboxed page, and a worklet module has to be fetched from a blob: URL, which is not
// guaranteed to be allowed by every host's script policy. ScriptProcessorNode needs no extra
// module load, so it is the more reliable choice here. Its callback is throttled to fire
// exactly once per hop (see hopSize below), keeping the work per call small.
class AudioManager{
  constructor(){
    this.ctx = null; this.stream = null; this.node = null; this.silentGain = null;
    this.running = false;
    this.windowSize = 2048; this.hopSize = 512;
    this.ring = null; this.ringCap = 0; this.w = 0;
    this.pitchDetector = new PitchDetector();
    this.onEstimate = null; // (estimate|null) => void
  }
  async start(){
    if (this.running) return;
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    const Ctx = window.AudioContext || window.webkitAudioContext;
    this.ctx = new Ctx({ latencyHint: "interactive" });
    if (this.ctx.state === "suspended") await this.ctx.resume();

    const sr = this.ctx.sampleRate;
    this.ringCap = this.windowSize * 3;
    this.ring = new Float32Array(this.ringCap);
    this.w = 0;

    const source = this.ctx.createMediaStreamSource(this.stream);
    this.node = this.ctx.createScriptProcessor(this.hopSize, 1, 1);
    this.node.onaudioprocess = (e) => this._onBuffer(e.inputBuffer.getChannelData(0), sr);

    // Route through a silent gain so the graph reaches destination (some browsers only
    // fire ScriptProcessor callbacks once connected all the way through), without any
    // audible feedback from the live microphone.
    this.silentGain = this.ctx.createGain();
    this.silentGain.gain.value = 0;
    source.connect(this.node);
    this.node.connect(this.silentGain);
    this.silentGain.connect(this.ctx.destination);

    this.running = true;
  }
  stop(){
    if (!this.running) return;
    if (this.node){ this.node.onaudioprocess = null; this.node.disconnect(); }
    if (this.silentGain) this.silentGain.disconnect();
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    if (this.ctx) this.ctx.close();
    this.ctx = null; this.stream = null; this.node = null; this.running = false;
  }
  resumeIfNeeded(){
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  }
  _onBuffer(input, sr){
    for (let i=0;i<input.length;i++){ this.ring[this.w] = input[i]; this.w = (this.w+1) % this.ringCap; }
    // hopSize samples arrive per callback, so exactly one analysis per callback.
    const n = this.windowSize;
    const win = new Float32Array(n);
    let r = (this.w - n + this.ringCap*2) % this.ringCap;
    for (let i=0;i<n;i++){ win[i] = this.ring[r]; r = (r+1) % this.ringCap; }
    const est = this.pitchDetector.estimate(win, sr);
    if (this.onEstimate) this.onEstimate(est);
  }
}

// ---------- Keyboard UI: C3-C5 ----------
const START_MIDI = 48, END_MIDI = 72;
function isWhite(m){ return ![1,3,6,8,10].includes(((m%12)+12)%12); }

const keyboardEl = document.getElementById("keyboard");
const whiteMidis = []; for (let m=START_MIDI;m<=END_MIDI;m++) if (isWhite(m)) whiteMidis.push(m);
const whiteEls = {}, blackEls = {};

function buildKeyboard(){
  keyboardEl.innerHTML = "";
  const w = keyboardEl.clientWidth || 320;
  const whiteW = w / whiteMidis.length;
  whiteMidis.forEach((m, i) => {
    const el = document.createElement("div");
    el.className = "wkey";
    el.style.left = (i*whiteW) + "px";
    el.style.width = whiteW + "px";
    if (m % 12 === 0){ const span = document.createElement("span"); span.textContent = midiToName(m); el.appendChild(span); }
    keyboardEl.appendChild(el);
    whiteEls[m] = el;
  });
  let whiteIndex = -1;
  const blackW = whiteW * 0.6, blackH = keyboardEl.clientHeight * 0.62;
  for (let m=START_MIDI; m<=END_MIDI; m++){
    if (isWhite(m)){ whiteIndex++; continue; }
    const el = document.createElement("div");
    el.className = "bkey";
    el.style.left = ((whiteIndex+1)*whiteW - blackW/2) + "px";
    el.style.width = blackW + "px";
    el.style.height = blackH + "px";
    keyboardEl.appendChild(el);
    blackEls[m] = el;
  }
}
function setActiveKey(midi){
  Object.values(whiteEls).forEach(el => el.classList.remove("active"));
  Object.values(blackEls).forEach(el => el.classList.remove("active"));
  if (midi == null) return;
  const el = whiteEls[midi] || blackEls[midi];
  if (el) el.classList.add("active");
}

// ---------- Wiring ----------
const audioManager = new AudioManager();
const noteDetector = new NoteDetector();
audioManager.onEstimate = (est) => noteDetector.process(est);

const noteOut = document.getElementById("noteOut");
const freqOut = document.getElementById("freqOut");
const debugOut = document.getElementById("debugOut");
const startBtn = document.getElementById("startBtn");
const permError = document.getElementById("permError");
const retryBtn = document.getElementById("retryBtn");

noteDetector.onUpdate = (out) => {
  noteOut.textContent = out.midi != null ? midiToName(out.midi) : "\u2014";
  freqOut.textContent = out.frequency > 0 ? out.frequency.toFixed(1) + " Hz" : "\u00A0";
  debugOut.innerHTML = "Listening: <b>" + (audioManager.running ? "YES" : "NO") + "</b><br>" +
    "Confidence: <b>" + out.confidence.toFixed(2) + "</b><br>" +
    "State: <b>" + out.state + "</b>";
  setActiveKey(out.midi);
};

async function startListening(){
  permError.style.display = "none";
  try{
    await audioManager.start();
    startBtn.textContent = "Stop Listening";
    startBtn.classList.add("listening");
  }catch(err){
    permError.style.display = "flex";
  }
}
function stopListening(){
  audioManager.stop();
  startBtn.textContent = "Start Listening";
  startBtn.classList.remove("listening");
  noteOut.textContent = "\u2014";
  freqOut.textContent = "\u00A0";
  setActiveKey(null);
}
startBtn.addEventListener("click", () => {
  if (audioManager.running) stopListening(); else startListening();
});
retryBtn.addEventListener("click", startListening);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") audioManager.resumeIfNeeded();
});
window.addEventListener("resize", buildKeyboard);
buildKeyboard();
</script>
</body>
</html>
